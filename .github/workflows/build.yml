name: Build

on: [push, pull_request]

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        cmakeArgs:
          - -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: install deps
      run: |
        sudo apt update
        sudo apt install -y libmariadb-dev zlib1g-dev mariadb-server xorg-dev
    - name: build
      run: |
        cmake -B build -G Ninja ${{ matrix.cmakeArgs }}
        cmake --build build

  windows:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        cmakeArgs:
          - -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          - -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        
    runs-on: windows-2025
      
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Visual Studio Development Environment
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $installationPath) {
          throw "Could not find a Visual Studio installation with the C++ toolchain"
        }

        $devCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
        $before = @{}
        Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $environment = & cmd.exe /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 >nul && set"
        if ($LASTEXITCODE -ne 0) {
          throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
        }

        foreach ($line in $environment) {
          $separator = $line.IndexOf('=')
          if ($separator -le 0) { continue }
          $name = $line.Substring(0, $separator)
          $value = $line.Substring($separator + 1)
          if (-not $before.ContainsKey($name) -or $before[$name] -ne $value) {
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
    - name: build
      run: |
        cmake -B build -G Ninja ${{ matrix.cmakeArgs }}
        cmake --build build
